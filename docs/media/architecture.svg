<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-label="orchestrator-mcp architecture">
<defs><marker id="u" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#161616"/></marker></defs>
<rect width="960" height="480" fill="#f3f2ee"/>
<text x="30" y="40" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#161616">From plan to applied files</text>
<rect x="30" y="70" width="270" height="88" rx="4" fill="#fbfaf7" stroke="#161616" stroke-width="1.5"/><text x="46" y="100" font-family="Consolas,'Cascadia Mono',Menlo,monospace" font-size="17" font-weight="700" fill="#161616">MCP client</text><text x="46" y="124" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#5f5b53">any stdio client</text><text x="46" y="144" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#5f5b53">calls orchestrator_* tools</text>
<rect x="345" y="70" width="270" height="88" rx="4" fill="#fbfaf7" stroke="#161616" stroke-width="1.5"/><text x="361" y="100" font-family="Consolas,'Cascadia Mono',Menlo,monospace" font-size="17" font-weight="700" fill="#161616">server.py</text><text x="361" y="124" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#5f5b53">18 tools over stdio</text><text x="361" y="144" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#5f5b53">status, results, pool</text>
<rect x="660" y="70" width="270" height="88" rx="4" fill="#fbfaf7" stroke="#161616" stroke-width="1.5"/><text x="676" y="100" font-family="Consolas,'Cascadia Mono',Menlo,monospace" font-size="17" font-weight="700" fill="#161616">plan.py</text><text x="676" y="124" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#5f5b53">validates the whole DAG first</text><text x="676" y="144" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#5f5b53">submit, wait, apply session</text>
<rect x="660" y="210" width="270" height="88" rx="4" fill="#fbfaf7" stroke="#161616" stroke-width="1.5"/><text x="676" y="240" font-family="Consolas,'Cascadia Mono',Menlo,monospace" font-size="17" font-weight="700" fill="#161616">store.py + locking.py</text><text x="676" y="264" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#5f5b53">SQLite, IMMEDIATE transactions</text><text x="676" y="284" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#5f5b53">atomic claim and lease</text>
<rect x="345" y="210" width="270" height="88" rx="4" fill="#fbfaf7" stroke="#161616" stroke-width="1.5"/><text x="361" y="240" font-family="Consolas,'Cascadia Mono',Menlo,monospace" font-size="17" font-weight="700" fill="#161616">runner.py</text><text x="361" y="264" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#5f5b53">detached DAG executor</text><text x="361" y="284" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#5f5b53">takes over a killed runner</text>
<rect x="30" y="210" width="270" height="88" rx="4" fill="#fbfaf7" stroke="#161616" stroke-width="1.5"/><text x="46" y="240" font-family="Consolas,'Cascadia Mono',Menlo,monospace" font-size="17" font-weight="700" fill="#161616">pool.py</text><text x="46" y="264" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#5f5b53">model calls, one per account</text><text x="46" y="284" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#5f5b53">no provider fallback</text>
<rect x="345" y="350" width="270" height="88" rx="4" fill="#fbfaf7" stroke="#161616" stroke-width="2.5"/><text x="361" y="380" font-family="Consolas,'Cascadia Mono',Menlo,monospace" font-size="17" font-weight="700" fill="#161616">execution.py</text><text x="361" y="404" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#5f5b53">temp workspace, pinned argv</text><text x="361" y="424" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#5f5b53">exit code 0 is the only pass</text>
<rect x="660" y="350" width="270" height="88" rx="4" fill="#fbfaf7" stroke="#161616" stroke-width="1.5"/><text x="676" y="380" font-family="Consolas,'Cascadia Mono',Menlo,monospace" font-size="17" font-weight="700" fill="#161616">your work_dir</text><text x="676" y="404" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#5f5b53">apply_outputs: scope and</text><text x="676" y="424" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#5f5b53">hash checked, never overwrites</text>
<rect x="359" y="424" width="190" height="7" fill="#c9e36a" opacity="0.9"/>
<line x1="300" y1="114.0" x2="341" y2="114.0" stroke="#161616" stroke-width="1.6" marker-end="url(#u)"/>
<line x1="615" y1="114.0" x2="656" y2="114.0" stroke="#161616" stroke-width="1.6" marker-end="url(#u)"/>
<line x1="795.0" y1="158" x2="795.0" y2="206" stroke="#161616" stroke-width="1.6" marker-end="url(#u)"/><text x="847.0" y="186.0" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="12" fill="#5f5b53">persist tasks</text>
<line x1="660" y1="254.0" x2="619" y2="254.0" stroke="#161616" stroke-width="1.6" marker-end="url(#u)"/>
<line x1="345" y1="254.0" x2="304" y2="254.0" stroke="#161616" stroke-width="1.6" marker-end="url(#u)"/>
<line x1="480.0" y1="298" x2="480.0" y2="346" stroke="#161616" stroke-width="1.6" marker-end="url(#u)"/><text x="514.0" y="326.0" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="12" fill="#5f5b53">answer</text>
<line x1="615" y1="394.0" x2="656" y2="394.0" stroke="#161616" stroke-width="1.6" marker-end="url(#u)"/>
<text x="30" y="460" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#5f5b53">A worker's own "done" is never read. The grading command is pinned before the worker runs and the worker cannot edit it.</text>
</svg>
